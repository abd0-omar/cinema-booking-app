# add config settings for the development environment here…
#
# JWT verification uses paths relative to the process cwd (run `cargo run` from the repo root).
# Override with APP_TRAILBASE__JWT_PUBLIC_KEY_PATH or APP_TRAILBASE__JWT_PUBLIC_KEY_PEM if needed.
[trailbase]
jwt_public_key_path = "traildepot/secrets/keys/public_key.pem"
# Required for the browser login page (`/login`): server POSTs to Trailbase `api/auth/v1/login`.
base_url = "http://127.0.0.1:4000"

[redis]
url = "redis://127.0.0.1:6379/"
key_prefix = "dev"
hold_ttl_seconds = 120
