<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Cinema Booking</title>
    <link rel="stylesheet" href="/static/app.css" />
</head>

<body class="min-h-screen flex items-center justify-center p-6 sm:p-8 bg-base-100">
    <div class="card bg-base-200 shadow-lg w-full max-w-sm">
        <div class="card-body">
            <h1 class="text-lg font-semibold tracking-tight">Sign in</h1>
            <p class="text-xs text-base-content/60 mb-4">Trailbase account (same instance as your JWT public key)</p>
            {% match success_message %}
            {% when Some with (msg) %}
            <div role="alert" class="alert alert-success alert-soft text-sm mb-4">{{ msg }}</div>
            {% when None %}
            {% endmatch %}
            {% match error_message %}
            {% when Some with (msg) %}
            <div role="alert" class="alert alert-error alert-soft text-sm mb-4">{{ msg }}</div>
            {% when None %}
            {% endmatch %}
            <form method="post" action="/login" autocomplete="on" class="flex flex-col gap-4">
                <label class="input input-bordered flex flex-col items-stretch gap-1 p-3">
                    <span class="label text-xs opacity-70">Email</span>
                    <input id="email" name="email" type="email" required autocomplete="username" />
                </label>
                <label class="input input-bordered flex flex-col items-stretch gap-1 p-3">
                    <span class="label text-xs opacity-70">Password</span>
                    <input id="password" name="password" type="password" required autocomplete="current-password" />
                </label>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
            <p class="text-sm text-base-content/70 mt-4">No account? <a href="/signup"
                    class="link link-primary link-hover">Create one</a></p>
            <a href="/" class="link link-primary link-hover text-sm mt-2 inline-block">← Back to cinema</a>
        </div>
    </div>
</body>

</html>
