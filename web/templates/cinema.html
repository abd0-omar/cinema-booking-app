<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Booking</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module"
        src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.7/bundles/datastar.js"></script>
</head>

<body class="min-h-screen bg-base-100 p-6 sm:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="navbar bg-base-200 rounded-box mb-8 px-4 py-2 flex-wrap gap-2">
            <div class="navbar-start">
                <h1 class="text-xl font-semibold tracking-tight">Cinema Booking</h1>
            </div>
            <div class="navbar-end flex flex-wrap items-center gap-2">
                <a href="/signup" class="btn btn-ghost btn-sm">Sign up</a>
                <a href="/login" class="btn btn-ghost btn-sm">Log in</a>
                <form method="post" action="/logout" class="m-0 inline">
                    <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
                </form>
                <span class="badge badge-neutral badge-sm whitespace-normal max-w-full">{{ user_label }}</span>
            </div>
        </header>

        <section class="card bg-base-200 shadow-sm mb-8 max-w-xl" data-signals:delay="400">
            <div class="card-body">
                <h2 class="card-title text-primary">Datastar demo</h2>
                <p class="text-sm text-base-content/70 mb-4">SSE patches stream from the server (Rust + datastar crate).
                    Adjust delay between character steps.</p>
                <div class="flex flex-wrap items-center gap-3 mb-4">
                    <label class="text-xs text-base-content/60" for="delay">Delay (ms)</label>
                    <input data-bind:delay id="delay" type="number" step="50" min="0" value="400"
                        class="input input-bordered input-sm w-28" />
                </div>
                <div class="flex flex-wrap items-center gap-3 mb-4">
                    <button type="button" class="btn btn-primary btn-sm" data-on:click="@get('/ds/hello-world')">Stream
                        hello</button>
                </div>
                <div id="message" class="text-2xl font-semibold mt-2 text-base-content">Hello, world!</div>
            </div>
        </section>

        <div class="flex flex-wrap gap-4 mb-8" id="movieList">
            <div class="w-full text-center text-base-content/60 py-12 text-sm">Movies load here when the cinema API is
                wired up.</div>
        </div>

        <div class="flex flex-wrap gap-8 items-start" id="mainContent" style="display: none">
            <div class="flex-1 min-w-[300px]">
                <div class="text-center text-xs uppercase tracking-widest text-base-content/60 mb-2">Screen</div>
                <div class="h-0.5 bg-linear-to-r from-transparent via-primary to-transparent rounded-sm mx-8 mb-6">
                </div>
                <div class="flex flex-col items-center gap-2" id="seatGrid"></div>
                <div class="flex flex-wrap justify-center gap-5 mt-6 text-xs text-base-content/60">
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3 rounded-t-md rounded-b-sm bg-base-300" aria-hidden="true"></div>
                        Available
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3 rounded-t-md rounded-b-sm bg-warning" aria-hidden="true"></div>
                        Your hold
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3 rounded-t-md rounded-b-sm bg-secondary" aria-hidden="true"></div>
                        Other hold
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3 rounded-t-md rounded-b-sm bg-error" aria-hidden="true"></div>
                        Confirmed
                    </div>
                </div>
            </div>
            <div id="checkoutArea"></div>
        </div>
    </div>
</body>

</html>
