<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — Cinema Booking</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #333;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #4fc3f7;
            --danger: #e74c3c;
            --font: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 22rem;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input {
            width: 100%;
            padding: 0.55rem 0.65rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--accent);
            color: #0a0a0a;
            margin-top: 0.25rem;
        }

        button:hover {
            opacity: 0.92;
        }

        .error {
            font-size: 0.8rem;
            color: var(--danger);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .back {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back:hover {
            color: var(--accent);
        }

        .signin {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .signin a {
            color: var(--accent);
            text-decoration: none;
        }

        .signin a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Create account</h1>
        <p class="subtitle">Registers with your Trailbase instance (same as JWT public key)</p>
        {% match error_message %}
        {% when Some with (msg) %}
        <p class="error">{{ msg }}</p>
        {% when None %}
        {% endmatch %}
        <form method="post" action="/signup" autocomplete="on">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username" />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password" />

            <label for="password_repeat">Confirm password</label>
            <input id="password_repeat" name="password_repeat" type="password" required autocomplete="new-password" />

            <button type="submit">Create account</button>
        </form>
        <p class="signin">Already have an account? <a href="/login">Sign in</a></p>
        <a class="back" href="/">← Back to cinema</a>
    </div>
</body>

</html>
