[package]
name = "cinema-booking-web"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# examples in docs don't run without a running database, etc.
doctest = false

[features]
test-helpers = [
    "dep:serde_json",
    "dep:tower",
    "dep:hyper",
    "dep:cinema-booking-macros",
    "cinema-booking-auth/test-utils",
    "cinema-booking-db/test-helpers",
]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
cinema-booking-auth = { path = "../auth" }
cinema-booking-config = { path = "../config" }
cinema-booking-db = { path = "../db" }
cinema-booking-trailbase = { path = "../trailbase-adapter" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.34", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
uuid = { version = "1.6", features = ["serde"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tower = { version = "0.5", features = ["util"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
validator = "0.20"
cinema-booking-macros = { path = "../macros", optional = true }
askama = { version = "0.15.6", features = ["derive"] }
cookie = "0.18"
datastar = { version = "0.3.1", features = ["axum"] }
async-stream = "0.3.6"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
fake = "4.0"
googletest = "0.14"
cinema-booking-db = { path = "../db", features = ["test-helpers"] }
cinema-booking-web = { path = ".", features = ["test-helpers"] }
