name: CI

on:
  push:
    branches:
      - main
  pull_request: {}


jobs:
  rustfmt:
    name: "Rust Format"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt

    - name: fmt
      run: cargo fmt --all --check

  clippy:
    name: "Clippy"
    runs-on: ubuntu-latest

    env:
      SQLX_OFFLINE: 1

    steps:
    - uses: actions/checkout@v3
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy
    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: test
      run: cargo test --all-features

  hurl:
    name: "Hurl API"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install Hurl
      env:
        HURL_VERSION: "7.0.0"
      run: |
        set -eux
        curl -sSL "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb" -o /tmp/hurl.deb
        sudo apt-get update -qq
        sudo apt-get install -y /tmp/hurl.deb

    - name: Build web server (test-helpers)
      run: cargo build -p cinema-booking-web --features test-helpers

    - name: Run Hurl against server
      run: |
        set -eux
        mkdir -p data
        rm -f data/hurl_ci.sqlite
        APP_ENVIRONMENT=test \
        APP_DATABASE__URL="sqlite:./data/hurl_ci.sqlite?mode=rwc" \
        APP_SERVER__PORT=14101 \
        ./target/debug/cinema-booking-web &
        srv_pid=$!
        cleanup() { kill "$srv_pid" 2>/dev/null || true; }
        trap cleanup EXIT
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:14101/tasks" || echo 000)
          if [ "$code" = "200" ]; then
            break
          fi
          sleep 0.5
        done
        if [ "$code" != "200" ]; then
          echo "server did not become ready (last HTTP code: $code)"
          exit 1
        fi
        printf 'base_url=http://127.0.0.1:14101\ntoken=test-bearer-token\n' > /tmp/hurl-ci.vars
        hurl --test --variables-file /tmp/hurl-ci.vars hurl/tasks.hurl
